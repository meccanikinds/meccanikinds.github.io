<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le mie foto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f0;--surface:#fff;--ink:#1d2b2a;--muted:#5d6d6b;--line:#d5dcda;--accent:#2f6f6a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121a19;--surface:#1a2524;--ink:#e6efed;--muted:#9bb0ad;--line:#2b3a38;--accent:#7fc4bc;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Instrument Sans",system-ui,sans-serif}
header{padding:2.5rem 1rem 1.5rem;text-align:center}
header h1{margin:0;font-size:1.6rem;font-weight:600;letter-spacing:-.01em}
header p{margin:.25rem 0 0;color:var(--muted)}
main{max-width:620px;margin:0 auto;padding:0 0 4rem}
article{background:var(--surface);border-block:1px solid var(--line);margin-bottom:1.5rem}
@media (min-width:660px){article{border:1px solid var(--line);border-radius:6px;overflow:hidden}}
.media{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.media::-webkit-scrollbar{display:none}
.media a{flex:0 0 100%;scroll-snap-align:center;display:block}
.media img{display:block;width:100%;height:auto;max-height:80vh;object-fit:cover;background:var(--line)}
.body{padding:.9rem 1rem 1.1rem}
.body p{margin:0 0 .5rem;max-width:62ch}
time{font-size:.85rem;color:var(--muted)}
.count{float:right;font-size:.85rem;color:var(--accent);font-weight:600}
.msg{text-align:center;color:var(--muted);padding:3rem 1rem}
a:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
</style>
</head>
<body>
<header>
  <h1>Le mie foto</h1>
  <p>Un diario per immagini</p>
</header>
<main id="feed"><p class="msg">Caricamento…</p></main>
<script>
const feed = document.getElementById('feed');
const fmt = new Intl.DateTimeFormat('it-IT', {day:'numeric', month:'long', year:'numeric'});

fetch('posts.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(posts => {
    feed.textContent = '';
    if (!posts.length) { feed.innerHTML = '<p class="msg">Ancora nessun post. Aggiungi il primo in posts.json.</p>'; return; }
    posts.sort((a, b) => b.data.localeCompare(a.data));
    for (const p of posts) {
      const fotos = Array.isArray(p.foto) ? p.foto : [p.foto];
      const art = document.createElement('article');
      const media = document.createElement('div');
      media.className = 'media';
      fotos.forEach((src, i) => {
        const a = document.createElement('a');
        a.href = src; a.target = '_blank'; a.rel = 'noopener';
        const img = new Image();
        img.src = src; img.alt = p.testo || 'Foto'; img.loading = i ? 'lazy' : 'lazy'; img.decoding = 'async';
        a.appendChild(img); media.appendChild(a);
      });
      const body = document.createElement('div');
      body.className = 'body';
      if (fotos.length > 1) {
        const c = document.createElement('span');
        c.className = 'count'; c.textContent = fotos.length + ' foto, scorri';
        body.appendChild(c);
      }
      if (p.testo) { const t = document.createElement('p'); t.textContent = p.testo; body.appendChild(t); }
      const d = document.createElement('time');
      d.dateTime = p.data; d.textContent = fmt.format(new Date(p.data));
      body.appendChild(d);
      art.append(media, body);
      feed.appendChild(art);
    }
  })
  .catch(() => {
    feed.innerHTML = '<p class="msg">Non riesco a leggere posts.json. Se hai aperto il file con doppio clic, provalo online su GitHub Pages: in locale il browser blocca la lettura.</p>';
  });
</script>
</body>
</html>
